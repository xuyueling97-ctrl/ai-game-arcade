<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0b17">
  <meta name="description" content="AI 游戏街机厅，汇集由不同 AI 模型开发的小游戏。挑选一款，在浏览器里开始游戏。">
  <title>AI 游戏街机厅</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./games.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body id="top">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arcade" viewBox="0 0 24 24">
      <path fill="currentColor" d="M5 3h14v2h2v12h-4v4H7v-4H3V5h2V3Zm0 2v10h14V5H5Zm4 12v2h6v-2H9Z"/>
      <path fill="currentColor" d="M7 8h2v2h2v2H9v2H7v-2H5v-2h2V8Zm7 1h2v2h-2V9Zm3 3h2v2h-2v-2Z"/>
    </symbol>
    <symbol id="icon-gamepad" viewBox="0 0 24 24">
      <path d="M6.6 7h10.8a4 4 0 0 1 3.9 3.1l1 4.5a3 3 0 0 1-5.1 2.7L15 15H9l-2.2 2.3a3 3 0 0 1-5.1-2.7l1-4.5A4 4 0 0 1 6.6 7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M7.5 9.5v4m-2-2h4m5.8.1h.1m2.7-2h.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 .8a11.2 11.2 0 0 0-3.5 21.8c.56.1.76-.24.76-.54v-2.1c-3.12.68-3.78-1.33-3.78-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.49-.29-5.1-1.25-5.1-5.54 0-1.23.43-2.23 1.15-3.02-.12-.28-.5-1.43.11-2.98 0 0 .94-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.55.23 2.7.11 2.98.72.79 1.15 1.79 1.15 3.02 0 4.3-2.62 5.25-5.12 5.53.4.35.76 1.03.76 2.08v3.11c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path fill="currentColor" d="M7 4v16l13-8L7 4Z"/>
    </symbol>
    <symbol id="icon-chip" viewBox="0 0 24 24">
      <path d="M8 3v3m4-3v3m4-3v3M8 18v3m4-3v3m4-3v3M3 8h3m-3 4h3m-3 4h3m12-8h3m-3 4h3m-3 4h3M6 6h12v12H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <a class="skip-link" href="#library">跳到游戏库</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-arcade"></use></svg></span>
        <span><span class="brand-ai">AI</span> 游戏街机厅</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#top" aria-current="location">首页</a>
        <a href="#library">游戏库</a>
      </nav>
      <a class="github-link" aria-label="GitHub（新标签页）" href="https://github.com/xuyueling97-ctrl" target="_blank" rel="noopener noreferrer">
        <svg class="icon" aria-hidden="true"><use href="#icon-github"></use></svg><span>GitHub</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="wrap hero-inner">
        <div class="hero-content">
          <p class="hero-label"><span></span> 浏览器小游戏</p>
          <h1 id="hero-title"><span class="hero-first"><span class="hero-ai">AI</span> 游戏</span><span class="hero-accent">街机厅</span></h1>
          <p class="hero-description">各路 AI 模型做的小游戏，都集合在这里。<br>挑一款，直接开玩。</p>
          <a class="button button-primary hero-button" href="#library">
            <svg class="icon" aria-hidden="true"><use href="#icon-gamepad"></use></svg>
            进入游戏库
          </a>
        </div>
        <div class="hero-art" aria-hidden="true">
          <img src="./assets/arcade.webp" alt="" width="1050" height="700" fetchpriority="high">
        </div>
        <span class="hero-pixel hero-pixel-one" aria-hidden="true"></span>
        <span class="hero-pixel hero-pixel-two" aria-hidden="true"></span>
        <span class="hero-pixel hero-pixel-three" aria-hidden="true"></span>
      </div>
    </section>

    <section class="library wrap" id="library" aria-labelledby="library-title">
      <div class="library-heading">
        <div class="library-title">
          <svg class="icon" aria-hidden="true"><use href="#icon-gamepad"></use></svg>
          <h2 id="library-title">游戏库</h2>
        </div>
        <div class="filters" role="group" aria-label="按游戏状态筛选" hidden></div>
      </div>
      <p id="results-status" class="visually-hidden" role="status"></p>
      <div class="game-grid" id="game-grid"></div>
      <noscript><p class="empty-state">请启用 JavaScript 以显示游戏库。</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="brand" href="#top">
        <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-arcade"></use></svg></span>
        <span><span class="brand-ai">AI</span> 游戏街机厅</span>
      </a>
      <a class="footer-link" href="https://github.com/xuyueling97-ctrl" target="_blank" rel="noopener noreferrer">
        <svg class="icon" aria-hidden="true"><use href="#icon-github"></use></svg>
        xuyueling97-ctrl
      </a>
    </div>
  </footer>

  <template id="game-template">
    <article class="game-card">
      <div class="card-art">
        <img alt="" width="720" height="320" decoding="async">
        <span class="game-status"><span class="status-dot"></span><span class="status-text"></span></span>
      </div>
      <div class="card-body">
        <h3 class="game-title"></h3>
        <p class="game-description"></p>
        <p class="game-model"><svg class="icon" aria-hidden="true"><use href="#icon-chip"></use></svg><span></span></p>
        <div class="card-actions">
          <a class="button button-play" target="_blank" rel="noopener noreferrer">
            <svg class="icon" aria-hidden="true"><use href="#icon-play"></use></svg>开始游戏
          </a>
          <a class="button button-source" target="_blank" rel="noopener noreferrer">
            <svg class="icon" aria-hidden="true"><use href="#icon-github"></use></svg>源码
          </a>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
